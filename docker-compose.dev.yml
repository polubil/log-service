services:
  api:
    build:
      context: api
      target: webapi
    ports:
      - "8000:8000"
    networks:
      - svc
    depends_on:
      db: 
        condition: service_healthy
    env_file:
      - .env.dev
    volumes:
      - ./api:/workspace/app
    working_dir: /workspace/app
    command: >
      uvicorn main:app
      --reload
      --reload-dir /workspace/app
      --host 0.0.0.0
      --port 8000
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  client:
    build:
      context: client
      target: client
    depends_on:
      api: 
        condition: service_healthy
    networks:
      - svc
    env_file:
      - .env.dev

  worker:
    build: worker
    depends_on:
      api: 
        condition: service_healthy
    networks:
      - svc
    env_file:
      - .env.dev
    volumes:
      - ./worker/data:/app/data
    working_dir: /app

  db:
    image: postgres:latest
    container_name: db_container_mtech
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d postgres_db"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - svc

volumes:
  pgdata:
    driver: local
  worker:
    driver: local

networks:
  svc:
